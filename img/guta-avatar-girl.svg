    <path d="M266 176 C274 152 286 136 298 126"/>
    <path d="M334 176 C326 152 314 136 302 126"/>
    <path d="M364 190 C354 160 334 140 308 128"/>
  </g>

  <!-- eyebrows -->
  <path d="M246 204 C258 194 274 194 284 200" stroke="#1A110B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M316 200 C326 194 342 194 354 204" stroke="#1A110B" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- eyes with lashes -->
  <g>
    <path d="M248 230 C258 215 280 215 290 230 C280 242 258 242 248 230 Z" fill="#FBF6EC"/>
    <circle cx="270" cy="229" r="10.5" fill="#3B200F"/>
    <circle cx="270" cy="229" r="5.5" fill="#120904"/>
    <circle cx="274" cy="225" r="3.2" fill="#FFFFFF"/>
    <path d="M244 228 C256 210 282 210 294 228" stroke="#1A110B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M246 222 L240 216 M252 217 L248 210 M259 214 L257 207" stroke="#1A110B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M310 230 C320 215 342 215 352 230 C342 242 320 242 310 230 Z" fill="#FBF6EC"/>
    <circle cx="330" cy="229" r="10.5" fill="#3B200F"/>
    <circle cx="330" cy="229" r="5.5" fill="#120904"/>
    <circle cx="334" cy="225" r="3.2" fill="#FFFFFF"/>
    <path d="M306 228 C318 210 344 210 356 228" stroke="#1A110B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M354 222 L360 216 M348 217 L352 210 M341 214 L343 207" stroke="#1A110B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- nose -->
  <path d="M297 240 C294 254 288 262 288 268 C290 276 298 278 300 276 C302 278 310 276 312 268 C312 262 306 254 303 240" fill="#5E361E" opacity=".35"/>
  <path d="M289 268 C292 273 296 273 298 270" stroke="#3A1F0E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M302 270 C304 273 308 273 311 268" stroke="#3A1F0E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M266 290 C280 314 320 314 334 290 C318 298 282 298 266 290 Z" fill="#5A2018"/>
  <path d="M271 292 C286 299 314 299 329 292 L325 299 C310 304 290 304 275 299 Z" fill="#FFFFFF"/>
  <path d="M266 290 C280 284 292 286 300 289 C308 286 320 284 334 290 C318 294 282 294 266 290 Z" fill="#7A2F28"/>

  <!-- cheeks and light -->
  <ellipse cx="250" cy="270" rx="16" ry="9" fill="#C8404A" opacity=".18"/>
  <ellipse cx="350" cy="270" rx="16" ry="9" fill="#C8404A" opacity=".18"/>
  <ellipse cx="282" cy="186" rx="26" ry="8" fill="#A8704A" opacity=".3"/>
</svg>
