<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" role="img" aria-label="A smiling church member in the khaki Guta uniform with a brown leather sash, pointing">
  <!-- Generic illustrated member in the men's Guta: khaki shirt and shorts, cream stockings, brown leather sash with pocket -->
  <defs>
    <linearGradient id="khaki" x1="0" x2="1">
      <stop offset="0" stop-color="#C9AE76"/>
      <stop offset="1" stop-color="#B89B60"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="160" cy="606" rx="96" ry="12" fill="#000" opacity=".12"/>

  <!-- legs -->
  <rect x="122" y="410" width="30" height="40" rx="8" fill="#7A4A2A"/>
  <rect x="168" y="410" width="30" height="40" rx="8" fill="#7A4A2A"/>
  <!-- cream stockings -->
  <rect x="120" y="440" width="34" height="140" rx="10" fill="#F1E8D2" stroke="#D8CBAA" stroke-width="2"/>
  <rect x="166" y="440" width="34" height="140" rx="10" fill="#F1E8D2" stroke="#D8CBAA" stroke-width="2"/>
  <rect x="120" y="440" width="34" height="12" rx="4" fill="#E3D6B6"/>
  <rect x="166" y="440" width="34" height="12" rx="4" fill="#E3D6B6"/>
  <!-- shoes -->
  <path d="M114 578 h44 a6 6 0 0 1 6 6 v10 h-62 a12 12 0 0 1 12 -16z" fill="#3E2716"/>
  <path d="M162 578 h44 a12 12 0 0 1 12 16 h-62 v-10 a6 6 0 0 1 6 -6z" fill="#3E2716"/>

  <!-- shorts -->
  <path d="M110 318 H210 L216 420 H166 L160 352 L154 420 H104 Z" fill="#B39459" stroke="#8F7645" stroke-width="2" stroke-linejoin="round"/>
  <path d="M160 330 V352" stroke="#8F7645" stroke-width="2"/>

  <!-- left arm (hanging) -->
  <path d="M104 178 L78 250 L100 258 L122 196 Z" fill="url(#khaki)" stroke="#8F7645" stroke-width="2" stroke-linejoin="round"/>
  <path d="M80 250 Q72 290 80 322 L96 322 Q100 290 99 257 Z" fill="#7A4A2A"/>
  <circle cx="88" cy="328" r="12" fill="#7A4A2A"/>

  <!-- right arm (raised, pointing) -->
  <path d="M206 186 L246 150 L262 168 L222 206 Z" fill="url(#khaki)" stroke="#8F7645" stroke-width="2" stroke-linejoin="round"/>
  <path d="M250 154 Q272 128 286 104 L300 114 Q288 140 262 168 Z" fill="#7A4A2A"/>
  <circle cx="294" cy="106" r="12" fill="#7A4A2A"/>
  <path d="M298 98 L316 76" stroke="#7A4A2A" stroke-width="9" stroke-linecap="round"/>

  <!-- shirt -->
  <path d="M112 168 Q160 150 208 168 L222 206 L214 330 H106 L98 206 Z" fill="url(#khaki)" stroke="#8F7645" stroke-width="2" stroke-linejoin="round"/>
  <!-- collar -->
  <path d="M142 158 L160 186 L150 192 L132 166 Z" fill="#D2B985" stroke="#8F7645" stroke-width="2" stroke-linejoin="round"/>
  <path d="M178 158 L160 186 L170 192 L188 166 Z" fill="#D2B985" stroke="#8F7645" stroke-width="2" stroke-linejoin="round"/>
  <!-- placket and buttons -->
  <path d="M160 186 V326" stroke="#8F7645" stroke-width="2"/>
  <g fill="#6E5A33"><circle cx="164" cy="210" r="3"/><circle cx="164" cy="244" r="3"/><circle cx="164" cy="278" r="3"/><circle cx="164" cy="310" r="3"/></g>
  <!-- chest pockets -->
  <rect x="122" y="208" width="28" height="30" rx="3" fill="none" stroke="#8F7645" stroke-width="2"/>
  <path d="M122 216 H150" stroke="#8F7645" stroke-width="2"/>
  <rect x="172" y="208" width="28" height="30" rx="3" fill="none" stroke="#8F7645" stroke-width="2"/>
  <path d="M172 216 H200" stroke="#8F7645" stroke-width="2"/>

  <!-- brown leather sash, shoulder to hip -->
  <path d="M102 176 L128 164 L222 314 L198 330 Z" fill="#6B4423" stroke="#4A2E17" stroke-width="2" stroke-linejoin="round"/>
  <path d="M115 172 L210 322" stroke="#A47548" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- pocket on the sash -->
  <g transform="translate(196 284) rotate(-32)">
    <rect x="-17" y="-20" width="34" height="42" rx="5" fill="#563519" stroke="#3A2311" stroke-width="2"/>
    <path d="M-17 -8 Q0 4 17 -8 V-20 H-17 Z" fill="#6B4423" stroke="#3A2311" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="-3" r="3" fill="#C9AE76"/>
  </g>

  <!-- neck and head -->
  <rect x="148" y="128" width="24" height="34" rx="8" fill="#6E4124"/>
  <circle cx="114" cy="96" r="9" fill="#7A4A2A"/>
  <circle cx="206" cy="96" r="9" fill="#7A4A2A"/>
  <ellipse cx="160" cy="92" rx="46" ry="50" fill="#7A4A2A"/>
  <path d="M116 82 Q118 40 160 38 Q202 40 204 82 Q196 60 160 58 Q124 60 116 82 Z" fill="#1E1410"/>
  <!-- face -->
  <path d="M136 80 Q145 74 154 80" stroke="#1E1410" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M166 80 Q175 74 184 80" stroke="#1E1410" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="145" cy="93" rx="5" ry="6" fill="#1E1410"/>
  <ellipse cx="175" cy="93" rx="5" ry="6" fill="#1E1410"/>
  <circle cx="147" cy="91" r="1.6" fill="#FFF"/>
  <circle cx="177" cy="91" r="1.6" fill="#FFF"/>
  <path d="M160 98 Q156 108 162 110" stroke="#5A321A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M138 116 Q160 138 182 116 Q160 126 138 116 Z" fill="#FFFFFF" stroke="#5A321A" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="132" cy="110" rx="7" ry="4" fill="#B3202A" opacity=".18"/>
  <ellipse cx="188" cy="110" rx="7" ry="4" fill="#B3202A" opacity=".18"/>
</svg>
