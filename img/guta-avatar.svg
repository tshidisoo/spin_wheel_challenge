<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="A smiling church member in the khaki Guta uniform with a brown leather sash, pointing up">
  <!-- Generic illustrated member in the men's Guta: khaki short-sleeved shirt, brown leather sash with pocket. Half-body, cropped at the waist. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A5733"/>
      <stop offset=".55" stop-color="#704224"/>
      <stop offset="1" stop-color="#5A331B"/>
    </linearGradient>
    <radialGradient id="face" cx=".42" cy=".38" r=".75">
      <stop offset="0" stop-color="#8E5A35"/>
      <stop offset=".6" stop-color="#74452A"/>
      <stop offset="1" stop-color="#5C341D"/>
    </radialGradient>
    <linearGradient id="khaki" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6BE88"/>
      <stop offset=".5" stop-color="#C4A86F"/>
      <stop offset="1" stop-color="#A88B52"/>
    </linearGradient>
    <linearGradient id="khakiDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFA36A"/>
      <stop offset="1" stop-color="#97794A"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A3518"/>
      <stop offset=".35" stop-color="#7D5028"/>
      <stop offset=".65" stop-color="#6B4220"/>
      <stop offset="1" stop-color="#4E2D13"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E4523"/>
      <stop offset="1" stop-color="#4A2B12"/>
    </linearGradient>
    <clipPath id="torsoClip">
      <path d="M150 420 C170 382 230 360 300 360 C370 360 430 382 452 420 L478 760 H122 Z"/>
    </clipPath>
  </defs>

  <!-- left arm, relaxed (viewer's left), cropped -->
  <path d="M150 420 C118 440 104 520 102 600 L100 760 H160 L170 560 Z" fill="url(#skin)"/>
  <path d="M152 418 C120 436 104 490 98 540 L160 556 L182 448 Z" fill="url(#khakiDark)" stroke="#7E6538" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M100 532 L160 548" stroke="#7E6538" stroke-width="3"/>

  <!-- raised right arm, pointing up to the wheel -->
  <path d="M478 300 C490 262 504 228 520 196 L556 214 C540 250 524 290 512 322 Z" fill="url(#skin)"/>
  <!-- hand -->
  <path d="M512 206 C506 180 520 160 542 160 C562 160 572 178 568 200 C564 220 548 228 532 226 C520 224 514 216 512 206 Z" fill="url(#skin)"/>
  <path d="M546 168 C552 148 558 130 566 116 C572 106 586 112 582 124 C576 142 570 158 566 174 Z" fill="#7A4A2A"/>
  <path d="M514 204 C504 200 500 190 506 184 C512 180 520 186 522 194" fill="#6E4124"/>
  <path d="M520 178 C524 170 534 168 540 174" stroke="#4E2B15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M518 192 C524 186 534 186 540 192" stroke="#4E2B15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M554 172 C560 170 566 174 566 180" stroke="#4E2B15" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- short sleeve -->
  <path d="M392 368 C424 338 450 312 470 286 L534 326 C512 360 486 398 458 438 Z" fill="url(#khaki)" stroke="#7E6538" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M470 290 L532 330" stroke="#7E6538" stroke-width="3"/>
  <path d="M430 380 C446 384 462 396 470 410" stroke="#A88B52" stroke-width="3" fill="none" opacity=".7"/>

  <!-- shirt body -->
  <path d="M150 420 C170 382 230 360 300 360 C370 360 430 382 452 420 L478 760 H122 Z" fill="url(#khaki)" stroke="#7E6538" stroke-width="2.5" stroke-linejoin="round"/>
  <g clip-path="url(#torsoClip)">
    <!-- fold shading -->
    <path d="M150 420 C176 470 182 560 170 760 H122 Z" fill="#A88B52" opacity=".45"/>
    <path d="M452 420 C430 480 426 580 440 760 H478 Z" fill="#97794A" opacity=".5"/>
    <path d="M230 600 C250 640 250 700 240 760" stroke="#A88B52" stroke-width="3" fill="none" opacity=".6"/>
    <path d="M372 610 C356 650 358 710 368 760" stroke="#A88B52" stroke-width="3" fill="none" opacity=".6"/>
    <!-- placket and buttons -->
    <path d="M300 410 V760" stroke="#7E6538" stroke-width="2.5"/>
    <path d="M310 410 V760" stroke="#C9AE76" stroke-width="2" opacity=".8"/>
    <g fill="#5E4A28" stroke="#3E3018" stroke-width="1">
      <circle cx="305" cy="452" r="5"/><circle cx="305" cy="530" r="5"/><circle cx="305" cy="608" r="5"/><circle cx="305" cy="686" r="5"/>
    </g>
    <!-- chest pockets with flaps -->
    <g stroke="#7E6538" stroke-width="2.5" stroke-linejoin="round">
      <path d="M200 470 H272 V548 Q236 558 200 548 Z" fill="#C9AE76"/>
      <path d="M196 462 H276 V486 Q236 500 196 486 Z" fill="url(#khakiDark)"/>
      <path d="M334 470 H406 V548 Q370 558 334 548 Z" fill="#C9AE76"/>
      <path d="M330 462 H410 V486 Q370 500 330 486 Z" fill="url(#khakiDark)"/>
    </g>
    <circle cx="236" cy="488" r="4" fill="#5E4A28"/>
    <circle cx="370" cy="488" r="4" fill="#5E4A28"/>
  </g>

  <!-- neck -->
  <path d="M262 300 L262 372 C278 388 322 388 338 372 L338 300 Z" fill="#5E361E"/>
  <path d="M262 340 C282 356 318 356 338 340 L338 300 L262 300 Z" fill="#4E2B15" opacity=".55"/>

  <!-- collar -->
  <path d="M252 366 C262 386 284 414 300 428 L282 446 C262 430 238 402 226 380 Z" fill="#D6BE88" stroke="#7E6538" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M348 366 C338 386 316 414 300 428 L318 446 C338 430 362 402 374 380 Z" fill="#CDB47E" stroke="#7E6538" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- brown leather sash, from his right shoulder across to the left hip -->
  <path d="M158 404 L206 380 L466 742 L470 760 H420 L410 748 Z" fill="url(#leather)" stroke="#3A2010" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M170 402 L426 752" stroke="#B5855A" stroke-width="2.5" stroke-dasharray="9 7" opacity=".9"/>
  <path d="M196 388 L456 748" stroke="#B5855A" stroke-width="2.5" stroke-dasharray="9 7" opacity=".9"/>
  <path d="M182 394 L438 750" stroke="#A06E40" stroke-width="5" opacity=".25"/>

  <!-- the "knife pocket" on the sash -->
  <g transform="translate(372 610) rotate(-36)">
    <path d="M-34 -42 H34 V40 Q34 56 18 56 H-18 Q-34 56 -34 40 Z" fill="url(#pouch)" stroke="#2E190A" stroke-width="2.5"/>
    <path d="M-28 -36 H28 V38 Q28 50 16 50 H-16 Q-28 50 -28 38 Z" fill="none" stroke="#A47548" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M-36 -46 H36 V-8 Q0 14 -36 -8 Z" fill="#7D5028" stroke="#2E190A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-30 -40 H30 V-11 Q0 6 -30 -11 Z" fill="none" stroke="#B5855A" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="0" cy="-2" r="6" fill="#C9AE76" stroke="#6E5A33" stroke-width="2"/>
  </g>

  <!-- head -->
  <ellipse cx="208" cy="226" rx="16" ry="26" fill="#6A3D22"/>
  <ellipse cx="392" cy="226" rx="16" ry="26" fill="#5E361E"/>
  <path d="M208 220 C210 230 214 236 218 238" stroke="#4E2B15" stroke-width="3" fill="none"/>
  <path d="M300 104 C362 104 394 154 392 218 C390 286 352 334 300 336 C248 334 210 286 208 218 C206 154 238 104 300 104 Z" fill="url(#face)"/>
  <!-- jaw shadow -->
  <path d="M222 268 C236 316 266 334 300 336 C334 334 364 316 378 268 C366 300 336 318 300 320 C264 318 234 300 222 268 Z" fill="#4E2B15" opacity=".35"/>

  <!-- hair: short, close-cropped -->
  <path d="M208 196 C206 136 246 92 300 92 C354 92 394 136 392 196 C384 172 372 156 352 148 C332 142 316 146 300 146 C282 146 266 142 246 148 C228 156 214 172 208 196 Z" fill="#1A110B"/>
  <g fill="#2E2016" opacity=".9">
    <circle cx="246" cy="118" r="2.2"/><circle cx="268" cy="106" r="2.2"/><circle cx="292" cy="100" r="2.2"/><circle cx="318" cy="102" r="2.2"/><circle cx="342" cy="110" r="2.2"/>
    <circle cx="362" cy="124" r="2.2"/><circle cx="232" cy="136" r="2.2"/><circle cx="258" cy="128" r="2.2"/><circle cx="284" cy="120" r="2.2"/><circle cx="310" cy="120" r="2.2"/>
    <circle cx="336" cy="126" r="2.2"/><circle cx="372" cy="144" r="2.2"/><circle cx="224" cy="160" r="2.2"/><circle cx="378" cy="168" r="2.2"/>
  </g>

  <!-- eyebrows -->
  <path d="M240 190 C254 178 274 178 286 186" stroke="#1A110B" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M314 186 C326 178 346 178 360 190" stroke="#1A110B" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <g>
    <path d="M244 216 C254 202 278 202 288 216 C278 228 254 228 244 216 Z" fill="#FBF6EC"/>
    <circle cx="267" cy="215" r="10" fill="#3B200F"/>
    <circle cx="267" cy="215" r="5" fill="#120904"/>
    <circle cx="271" cy="211" r="3" fill="#FFFFFF"/>
    <path d="M242 214 C254 199 278 199 290 214" stroke="#1A110B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M312 216 C322 202 346 202 356 216 C346 228 322 228 312 216 Z" fill="#FBF6EC"/>
    <circle cx="333" cy="215" r="10" fill="#3B200F"/>
    <circle cx="333" cy="215" r="5" fill="#120904"/>
    <circle cx="337" cy="211" r="3" fill="#FFFFFF"/>
    <path d="M310 214 C322 199 346 199 358 214" stroke="#1A110B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M250 228 C258 234 274 234 282 228" stroke="#4E2B15" stroke-width="2" fill="none" opacity=".6"/>
    <path d="M318 228 C326 234 342 234 350 228" stroke="#4E2B15" stroke-width="2" fill="none" opacity=".6"/>
  </g>

  <!-- nose -->
  <path d="M296 226 C292 244 284 256 282 264 C282 272 292 276 300 274 C308 276 318 272 318 264 C316 256 308 244 304 226" fill="#5E361E" opacity=".45"/>
  <path d="M284 266 C288 272 294 272 296 268" stroke="#3A1F0E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M304 268 C306 272 312 272 316 266" stroke="#3A1F0E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="298" cy="252" rx="4" ry="9" fill="#9A6440" opacity=".6"/>

  <!-- smile -->
  <path d="M256 286 C272 316 328 316 344 286 C326 296 274 296 256 286 Z" fill="#4A1E12"/>
  <path d="M262 289 C280 298 320 298 338 289 L334 298 C316 304 284 304 266 298 Z" fill="#FFFFFF"/>
  <path d="M272 306 C286 314 314 314 328 306 C318 312 282 312 272 306 Z" fill="#B3474A" opacity=".8"/>
  <path d="M254 284 C258 288 260 290 262 292" stroke="#3A1F0E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M346 284 C342 288 340 290 338 292" stroke="#3A1F0E" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- cheeks and forehead light -->
  <ellipse cx="246" cy="262" rx="16" ry="9" fill="#B3202A" opacity=".12"/>
  <ellipse cx="354" cy="262" rx="16" ry="9" fill="#B3202A" opacity=".12"/>
  <ellipse cx="280" cy="160" rx="34" ry="10" fill="#A8704A" opacity=".35"/>
</svg>
