<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spin & Win</title>
  <meta name="description" content="Watch the live pledge draw every Sunday after morning service.">
  <meta property="og:title" content="Spin & Win: weekly pledge draw">
  <meta property="og:description" content="Watch the live draw every Sunday after morning service. Who will open the mystery box?">
  <!-- For WhatsApp link previews, change this to the full address, e.g. https://yourname.github.io/spin-box/og-image.png -->
  <meta property="og:image" content="og-image.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="demoBanner" class="demo-banner" hidden>Demo mode: Firebase isn't connected yet, so this only syncs between tabs in this browser.</div>

  <header class="top">
    <h1 id="title">Spin & Win</h1>
    <p id="subtitle" class="subtitle"></p>
  </header>

  <main class="stage">
    <section class="wheel-wrap" aria-label="Name wheel">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" class="wheel"></canvas>
      <div id="ticker" class="ticker" aria-live="off"></div>
    </section>

    <section class="box-wrap" aria-label="Mystery box">
      <div class="box3d-scene" role="img" aria-label="Mystery gift box">
        <div id="box" class="box3d">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face right"></div>
          <div class="face left"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
          <div class="bow"></div>
          <div class="bow turned"></div>
        </div>
        <div class="box3d-shadow"></div>
      </div>
      <p id="boxCaption" class="box-caption">What's in the box?</p>
    </section>
  </main>

  <p id="status" class="status" aria-live="polite"></p>
  <p id="count" class="count"></p>
  <p class="join-link"><a href="join.html">Paid your pledge? Join the draw</a></p>

  <div id="result" class="result" hidden>
    <div class="result-card" role="dialog" aria-labelledby="winnerName">
      <p class="result-label">Congratulations</p>
      <h2 id="winnerName"></h2>
      <p class="result-label">you've won</p>
      <p id="prizeText" class="prize"></p>
      <button id="closeResult" class="btn">Close</button>
    </div>
  </div>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script type="module" src="js/viewer.js"></script>
</body>
</html>
